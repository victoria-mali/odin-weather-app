<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather app</title>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Weather</h1>
        <div class="search-container">
          <input
            type="search"
            id="city-search"
            name="city-search"
            aria-label="City search"
            placeholder="Enter your city"
          />

          <button class="search-btn">Search</button>
        </div>
      </div>

      <div class="temperature-info">
        <div class="temp-info-row1">
        <p class="conditions">Sunny</p>
          <div class="switch-buttons">
            <button class="celsius-btn active-btn">°C</button>
            <button class="fahrenheit-btn">°F</button>
          </div>
        </div>
        <div class="temp-info-row2">
          <div class="temp-info-left">
            <p class="temperature">31°C</p>
            <p class="temp-feels-like">Feels like 31°C</p>
          </div>
          <p class="location">Porto, Portugal</p>
        </div>
      </div>
    </div>
  </body>
</html>
