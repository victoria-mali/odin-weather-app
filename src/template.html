<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather app</title>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo-div">
          <img class="logo" src="img/logo-white.svg" alt="Cloudee logo representing a cloud">
          <img class="logo-text" src="img/logo-text.svg" alt="Cloudee text logo">
        </div>
        <div class="header-right">
          <div class="location">
            <svg
              class="location-icon"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M12 21C15.5 17.4 19 14.1764 19 10.2C19 6.22355 15.866 3 12 3C8.13401 3 5 6.22355 5 10.2C5 14.1764 8.5 17.4 12 21Z"
                stroke="#3b343b"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M12 12C13.1046 12 14 11.1046 14 10C14 8.89543 13.1046 8 12 8C10.8954 8 10 8.89543 10 10C10 11.1046 10.8954 12 12 12Z"
                stroke="#3b343b"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <p class="location-text">Porto</p>
          </div>
          <form method="get" class="search-container">
            <input
              type="search"
              class="search"
              id="city-search"
              name="city-search"
              aria-label="City search"
              placeholder="Enter your city"
              maxlength="25"
              required
            />

            <button type="submit" class="search-btn">
              <svg viewBox="0 0 24 24" aria-hidden="true" class="icon">
                <g>
                  <path
                    d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z"
                  ></path>
                </g>
              </svg>
            </button>

            <div class="loader invisible"></div>
          </form>
        </div>
      </div>

              <p class="error invisible"></p>

      <div class="temperature-info">
        <div class="temp-info-row1">
          <p class="conditions">Sunny</p>
          <div class="switch-buttons">
            <button class="celsius-btn active-btn">°C</button>
            <button class="fahrenheit-btn">°F</button>
          </div>
        </div>
        <div class="temp-info-row2">
          <div class="temp-info-left">
            <div>
<p class="temperature">31°C</p>
            </div>
            
            <p class="temp-feels-like">Feels like 31°C</p>
          </div>
          <p class="description"></p>
        </div>
      </div>

      <div class="forecast">
        <div class="day">
          
        </div>
      </div>

      <div class="more-info">
        <div class="info-div">
          <div>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" height="24" viewBox="0 0 24 24" width="24"><path d="m16 18.5-1 2.5m-7-2.5-1 2.5m5-2.5-1 2.5m-4-6c-2.76142 0-5-2.2386-5-5 0-2.76142 2.23858-5 5-5 .03315 0 .06622.00032.09922.00097.91018-1.78137 2.76305-3.00097 4.90078-3.00097 2.5192 0 4.6429 1.69375 5.2943 4.00462.0682-.00307.1368-.00462.2057-.00462 2.4853 0 4.5 2.01472 4.5 4.5 0 2.4853-2.0147 4.5-4.5 4.5-3.7566 0-6.2648 0-10.5 0z" stroke="#91adc6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
            <p class="info-desc">Precipitation</p>
          </div>
          <p class="info-value precip"></p>
        </div>
        <div class="info-div">
          <div>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" height="24" viewBox="0 0 24 24" width="24"><path d="m17 19.4c0 1.4359-1.1193 2.6-2.5 2.6s-2.5-1.1641-2.5-2.6v-7.4m-9.87373-1.5937c.76321-4.76539 4.89326-8.4063 9.87373-8.4063 4.9804 0 9.1104 3.64091 9.8737 8.4063.0745.4651.1117.6976.0182.946-.0744.1977-.2566.4113-.44.5161-.2305.1316-.5043.1316-1.0519.1316h-16.80003c-.54765 0-.82147 0-1.05196-.1316-.18338-.1048-.36555-.3184-.43996-.5161-.09352-.2484-.05627-.4809.01822-.946z" stroke="#eeb2a9" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
            <p class="info-desc">Chance of rain</p>
          </div>
          <p class="info-value precipprob"></p>
        </div>
        <div class="info-div">
          <div>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" height="24" viewBox="0 0 24 24" width="24"><g stroke="#9fc4e8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="m22 16c0 3.3137-2.6863 6-6 6s-6-2.6863-6-6c0-4.3137 6-14 6-14s6 9.6863 6 14z"/><path d="m8 9c0 1.6569-1.34315 3-3 3s-3-1.3431-3-3c0-2.15685 3-7 3-7s3 4.84315 3 7z"/></g></svg>
            <p class="info-desc">Humidity</p>
          </div>
          <p class="info-value humidity"></p>
        </div>
        <div class="info-div">
          <div>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" height="24" viewBox="0 0 24 24" width="24"><path d="m12 2v2m0 16v2m-8-10h-2m4.31412-5.68588-1.41422-1.41422m12.786 1.41422 1.4142-1.41422m-12.78598 12.7901-1.41422 1.4142m12.786-1.4142 1.4142 1.4142m2.8999-7.1042h-2m-3 0c0 2.7614-2.2386 5-5 5-2.76142 0-5-2.2386-5-5 0-2.76142 2.23858-5 5-5 2.7614 0 5 2.23858 5 5z" stroke="#fbbd4c" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
            <p class="info-desc">UV index</p>
          </div>
          <p class="info-value uvindex"></p>
        </div>
        <div class="info-div">
          <div>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" height="24" viewBox="0 0 24 24" width="24"><path d="m9.50929 4.66667c.36621-.40917.89841-.66667 1.49071-.66667 1.1046 0 2 .89543 2 2s-.8954 2-2 2h-8.99998m10.50928 11.3333c.3662.4092.8984.6667 1.4907.6667 1.1046 0 2-.8954 2-2s-.8954-2-2-2h-11.99998m14.76388-9c.5493-.61375 1.3476-1 2.2361-1 1.6569 0 3 1.34315 3 3 0 1.6569-1.3431 3-3 3h-17" stroke="#97c0c0" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
            <p class="info-desc">Wind</p>
          </div>
          <p class="info-value windspeed"></p>
        </div>
        <div class="info-div">
          <div>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" height="24" viewBox="0 0 24 24" width="24"><path d="m17 4v11m0 0-4-4m4 4 4-4m-14-7v16m0 0-4-4m4 4 4-4" stroke="#cfa4cc" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
            <p class="info-desc">Pressure</p>
          </div>
          <p class="info-value pressure"></p>
        </div>
        <div class="info-div">
          <div>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" height="24" viewBox="0 0 24 24" width="24"><path d="m4 18h-2m4.31412-5.6859-1.41422-1.4142m12.7859 1.4142 1.4142-1.4142m2.9 7.1001h-2m-13 0c0-2.7614 2.23858-5 5-5 2.7614 0 5 2.2386 5 5m5 4h-20m14-16-4-4m0 0-4 4m4-4v7" stroke="#f69f95" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
            <p class="info-desc">Sunrise</p>
          </div>
          <p class="info-value sunrise"></p>
        </div>
        <div class="info-div">
          <div>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" height="24" viewBox="0 0 24 24" width="24"><path d="m4 18h-2m4.31412-5.6859-1.41422-1.4142m12.7859 1.4142 1.4142-1.4142m2.9 7.1001h-2m-13 0c0-2.7614 2.23858-5 5-5 2.7614 0 5 2.2386 5 5m5 4h-20m14-17-4 4m0 0-4-4m4 4v-7" stroke="#fabb92" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
            <p class="info-desc">Sunset</p>
          </div>
          <p class="info-value sunset"></p>
        </div>
      </div>

      <div class="copyright">
        <a href="https://github.com/victoria-mali/odin-weather-app" target="_blank">
            <img src="img/GitHub_Invertocat_Black.svg" alt="GitHub logo">
        </a>
        <div>Victoria Mali © 2026</div>
    </div>
  </body>
</html>
