<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather app</title>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="header-left">
          <h1>Weather</h1>
          <div class="location">
            <svg
              class="location-icon"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M12 21C15.5 17.4 19 14.1764 19 10.2C19 6.22355 15.866 3 12 3C8.13401 3 5 6.22355 5 10.2C5 14.1764 8.5 17.4 12 21Z"
                stroke="#3b343b"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M12 12C13.1046 12 14 11.1046 14 10C14 8.89543 13.1046 8 12 8C10.8954 8 10 8.89543 10 10C10 11.1046 10.8954 12 12 12Z"
                stroke="#3b343b"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <p class="location-text">Porto</p>
          </div>
        </div>

        <div class="search-container">
          <input
            type="search"
            class="search"
            id="city-search"
            name="city-search"
            aria-label="City search"
            placeholder="Enter your city"
          />

          <button type="submit" class="search-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="icon">
              <g>
                <path
                  d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z"
                ></path>
              </g>
            </svg>
          </button>
        </div>
      </div>

      <div class="temperature-info">
        <div class="temp-info-row1">
          <p class="conditions">Sunny</p>
          <div class="switch-buttons">
            <button class="celsius-btn active-btn">°C</button>
            <button class="fahrenheit-btn">°F</button>
          </div>
        </div>
        <div class="temp-info-left">
          <p class="temperature">31°C</p>
          <p class="temp-feels-like">Feels like 31°C</p>
        </div>
      </div>
    </div>
  </body>
</html>
